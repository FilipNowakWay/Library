<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="./reset.css">
	<link rel="stylesheet" href="./style.css?v=5">
	<script src="script.js" defer></script>
</head>
<body>
    <div class="menu">
        <button class="addBookBtn">Add Book</button>
    </div>
    <form class="book-form" id="add-book-form">
        <h2>Add a book</h2>
        <div class="form-field">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-field">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" required>
        </div>
        <div class="form-field">
            <label for="pages">Pages</label>
            <input type="number" id="pages" name="pages" min="1" required>
        </div>
        <label class="checkbox-field" for="status">
            <input type="checkbox" id="status" name="status">
            Finished
        </label>
        <button type="submit" class="addBookBtn">Add Book</button>
    </form>
    <div class="container"></div>
</body>
</html>
